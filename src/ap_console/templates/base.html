<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fathm{% endblock %} — chart room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="/console/static/htmx.min.js"></script>
<style>
  :root{
    --ink:#07090D; --slate:#121826; --brass:#E8B36A; --drift:#93856F;
    --bone:#F4EFE6; --line:rgba(147,133,111,.25); --rust:#B65C4A; --ok:#6fe3a0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:'Archivo',sans-serif;line-height:1.5}
  a{color:var(--brass)}
  .mono{font-family:'IBM Plex Mono',monospace}
  header.chrome{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 6vw;border-bottom:1px solid var(--line);background:rgba(18,24,38,.5)
  }
  .wordmark{font-weight:680;font-variation-settings:"wdth" 84;font-size:22px;display:flex;align-items:baseline}
  .wordmark .sunk{transform:translateY(.19em);color:var(--brass)}
  nav.crumbs a{margin-right:18px;text-decoration:none;color:var(--drift);font-size:13px;
    letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
  nav.crumbs a:hover, nav.crumbs a.active{color:var(--bone)}
  .whoami{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--drift);display:flex;align-items:center;gap:14px}
  button.link-btn{background:none;border:1px solid rgba(147,133,111,.4);color:var(--drift);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 12px;border-radius:6px;cursor:pointer}
  button.link-btn:hover{color:var(--bone);border-color:var(--brass)}
  main{max-width:1080px;margin:0 auto;padding:40px 6vw}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--brass);margin-bottom:10px}
  h1{font-size:clamp(24px,3.6vw,34px);font-weight:640;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"wdth" 88}
  .card{border:1px solid var(--line);border-radius:10px;background:rgba(18,24,38,.5);padding:22px;margin-top:18px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--drift);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
    font-family:'IBM Plex Mono',monospace}
  tr:hover td{background:rgba(232,179,106,.04)}
  .badge{display:inline-block;padding:.22rem .65rem;border-radius:999px;font-weight:600;font-size:.78rem;
    letter-spacing:.03em;font-family:'IBM Plex Mono',monospace}
  .badge.approved,.badge.pass{background:#163a24;color:var(--ok);border:1px solid #29613f}
  .badge.rejected,.badge.fail{background:#3a1616;color:#ff8a8a;border:1px solid #612929}
  .badge.draft{background:#2a2410;color:var(--brass);border:1px solid rgba(232,179,106,.35)}
  .badge.in_review{background:#12233a;color:#7db8e8;border:1px solid #204a6e}
  form.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:18px}
  form.filters label{display:flex;flex-direction:column;gap:5px;font-size:.75rem;color:var(--drift);
    text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace}
  form.filters input,form.filters select{background:#04060A;border:1px solid var(--line);border-radius:6px;
    color:var(--bone);padding:7px 10px;font-family:'Archivo',sans-serif;font-size:14px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.5rem 1.5rem}
  .meta div span{display:block;color:var(--drift);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    font-family:'IBM Plex Mono',monospace;margin-bottom:2px}
  .empty{color:var(--drift);font-style:italic;padding:20px 0}
  iframe.gate-report{width:100%;height:640px;border:1px solid var(--line);border-radius:10px;margin-top:10px;
    background:#14161a}
  .flash{border:1px solid var(--rust);background:rgba(182,92,74,.12);color:#ffb6a8;border-radius:8px;
    padding:10px 14px;margin-bottom:16px;font-size:.85rem}
  .review-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  form.review-action{display:flex;gap:6px;align-items:center;margin:0}
  form.review-action input[type="text"]{background:#04060A;border:1px solid var(--line);border-radius:6px;
    color:var(--bone);padding:5px 8px;font-family:'Archivo',sans-serif;font-size:13px;width:150px}
  button.btn{border-radius:6px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);background:none}
  button.btn.approve{color:var(--ok);border-color:#29613f}
  button.btn.approve:hover{background:rgba(111,227,160,.1)}
  button.btn.reject{color:#ff8a8a;border-color:#612929}
  button.btn.reject:hover{background:rgba(182,92,74,.12)}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
  .timeline li:last-child{border-bottom:none}
  .timeline .ts{color:var(--drift);font-size:.76rem;font-family:'IBM Plex Mono',monospace}
  .timeline .reason{color:var(--drift);font-size:.82rem;margin-top:2px}
</style>
</head>
<body>
{% if identity %}
<header class="chrome">
  <a href="/console/packages" style="text-decoration:none"><div class="wordmark">f<span class="sunk">a</span>thm</div></a>
  <nav class="crumbs">
    <a href="/console/packages" class="{% block nav_packages %}{% endblock %}">Packages</a>
    <a href="/console/review-queue" class="{% block nav_review_queue %}{% endblock %}">Review Queue</a>
  </nav>
  <div class="whoami">
    <span>{{ identity.id }} · {{ identity.roles|map(attribute="value")|join(", ") }}</span>
    <button class="link-btn"
      hx-post="/logout"
      hx-headers='{"X-Csrf": "{{ csrf_token }}"}'
      hx-on::after-request="if(event.detail.successful) window.location='/console/login'">
      Log out
    </button>
  </div>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
