<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fathm{% endblock %} — chart room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..500&display=swap" rel="stylesheet">
<script src="/console/static/htmx.min.js"></script>
<script src="/console/static/sse.js"></script>
<style>
  :root{
    --ink:#07090D; --ink2:#0A0E16; --slate:#121826; --brass:#E8B36A; --brass-dim:#B98C4F;
    --drift:#93856F; --bone:#E8E0D5; --line:rgba(147,133,111,.22); --rust:#B65C4A; --ok:#6fe3a0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:'Archivo',sans-serif;line-height:1.5}
  a{color:var(--brass)}
  .mono{font-family:'IBM Plex Mono',monospace}
  header.chrome{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 6vw;border-bottom:1px solid var(--line);background:rgba(18,24,38,.5)
  }
  /* the mark: F is a sounding line (see brand/fathm-brand-final.html "The mark (final)") */
  .wordmark{display:flex;align-items:baseline;font-size:22px}
  .wordmark .fmark{position:relative;width:.53em;font-size:inherit}
  .wordmark .fmark svg{position:absolute;left:0;top:-.74em;width:.58em;overflow:visible}
  .wordmark .rest{font-family:'Reckless Neue','Reckless',Newsreader,serif;font-weight:300;
    font-variation-settings:'opsz' 72;font-size:inherit;line-height:1;letter-spacing:-0.015em;color:var(--bone)}
  nav.crumbs a{margin-right:18px;text-decoration:none;color:var(--drift);font-size:13px;
    letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
  nav.crumbs a:hover, nav.crumbs a.active{color:var(--bone)}
  .whoami{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--drift);display:flex;align-items:center;gap:14px}
  button.link-btn{background:none;border:1px solid rgba(147,133,111,.4);color:var(--drift);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 12px;border-radius:6px;cursor:pointer}
  button.link-btn:hover{color:var(--bone);border-color:var(--brass)}
  main{max-width:1080px;margin:0 auto;padding:40px 6vw}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--brass);margin-bottom:10px}
  h1{font-size:clamp(24px,3.6vw,34px);font-weight:640;letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"wdth" 88}
  .card{border:1px solid var(--line);border-radius:10px;background:rgba(18,24,38,.5);padding:22px;margin-top:18px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--drift);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
    font-family:'IBM Plex Mono',monospace}
  tr:hover td{background:rgba(232,179,106,.04)}
  .badge{display:inline-block;padding:.22rem .65rem;border-radius:999px;font-weight:600;font-size:.78rem;
    letter-spacing:.03em;font-family:'IBM Plex Mono',monospace}
  .badge.approved,.badge.pass{background:#163a24;color:var(--ok);border:1px solid #29613f}
  .badge.rejected,.badge.fail{background:#3a1616;color:#ff8a8a;border:1px solid #612929}
  .badge.draft{background:#2a2410;color:var(--brass);border:1px solid rgba(232,179,106,.35)}
  .badge.in_review{background:#12233a;color:#7db8e8;border:1px solid #204a6e}
  .badge.pending_hitl{background:#2a2410;color:var(--brass);border:1px solid rgba(232,179,106,.35)}
  .badge.withdrawn{background:#242424;color:var(--drift);border:1px solid var(--line)}
  form.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:18px}
  form.filters label{display:flex;flex-direction:column;gap:5px;font-size:.75rem;color:var(--drift);
    text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace}
  form.filters input,form.filters select{background:#04060A;border:1px solid var(--line);border-radius:6px;
    color:var(--bone);padding:7px 10px;font-family:'Archivo',sans-serif;font-size:14px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.5rem 1.5rem}
  .meta div span{display:block;color:var(--drift);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    font-family:'IBM Plex Mono',monospace;margin-bottom:2px}
  .empty{color:var(--drift);font-style:italic;padding:20px 0}
  iframe.gate-report{width:100%;height:640px;border:1px solid var(--line);border-radius:10px;margin-top:10px;
    background:#14161a}
  .flash{border:1px solid var(--rust);background:rgba(182,92,74,.12);color:#ffb6a8;border-radius:8px;
    padding:10px 14px;margin-bottom:16px;font-size:.85rem}
  .notice{border:1px solid var(--brass-dim);background:rgba(232,179,106,.08);color:var(--brass);
    border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.85rem}
  .tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
  .tabs a{text-decoration:none;color:var(--drift);font-family:'IBM Plex Mono',monospace;font-size:.76rem;
    letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);border-radius:999px}
  .tabs a.active{color:var(--ink);background:var(--brass);border-color:var(--brass)}
  .tabs a:hover:not(.active){color:var(--bone);border-color:var(--brass-dim)}
  .diff-json{background:#04060A;border:1px solid var(--line);border-radius:8px;padding:14px;
    overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .diff-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .diff-cols .diff-json{max-height:320px;overflow-y:auto}
  @media (max-width:700px){.diff-cols{grid-template-columns:1fr}}
  textarea.diff-edit{width:100%;min-height:200px;background:#04060A;border:1px solid var(--line);
    border-radius:6px;color:var(--bone);padding:10px;font-family:'IBM Plex Mono',monospace;
    font-size:13px}
  button.btn:disabled{opacity:.4;cursor:not-allowed}
  .evidence-links{display:flex;flex-wrap:wrap;gap:8px}
  .decision-form{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;
    border-top:1px solid var(--line)}
  .decision-form:first-child{border-top:none;padding-top:0}
  .review-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  form.review-action{display:flex;gap:6px;align-items:center;margin:0}
  form.review-action input[type="text"]{background:#04060A;border:1px solid var(--line);border-radius:6px;
    color:var(--bone);padding:5px 8px;font-family:'Archivo',sans-serif;font-size:13px;width:150px}
  button.btn{border-radius:6px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);background:none}
  button.btn.approve{color:var(--ok);border-color:#29613f}
  button.btn.approve:hover{background:rgba(111,227,160,.1)}
  button.btn.reject{color:#ff8a8a;border-color:#612929}
  button.btn.reject:hover{background:rgba(182,92,74,.12)}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
  .timeline li:last-child{border-bottom:none}
  .timeline .ts{color:var(--drift);font-size:.76rem;font-family:'IBM Plex Mono',monospace}
  .timeline .reason{color:var(--drift);font-size:.82rem;margin-top:2px}
  .chat-form{display:flex;gap:10px;margin-top:18px}
  .chat-form input{flex:1;background:#04060A;border:1px solid var(--line);border-radius:6px;
    color:var(--bone);padding:10px 12px;font-family:'Archivo',sans-serif;font-size:15px}
  .chat-form button{background:var(--brass);color:var(--ink);border:none;border-radius:6px;
    padding:0 20px;font-weight:700;letter-spacing:.03em;cursor:pointer}
  .chat-form button:hover{filter:brightness(1.08)}
  #chat-transcript{display:flex;flex-direction:column;gap:14px;margin-top:20px}
  .chat-turn .chat-question{color:var(--drift);font-size:.82rem;margin-bottom:10px}
  .chat-turn .chat-question::before{content:"› ";color:var(--brass)}
  .chat-answer{white-space:pre-wrap;font-size:15px;line-height:1.6}
  .chat-pending{color:var(--drift)}
  .chat-citations{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .citation-link{display:inline-block;border:1px solid var(--line);border-radius:999px;
    padding:.3rem .8rem;font-size:.76rem;text-decoration:none;color:var(--brass)}
  .citation-link:hover{border-color:var(--brass);background:rgba(232,179,106,.08)}
  .chat-error:empty{display:none}
  .chat-error{color:#ff8a8a;border:1px solid #612929;background:rgba(182,92,74,.1);border-radius:8px;
    padding:10px 14px;margin-top:12px;font-size:.85rem}
</style>
</head>
<body>
{% if identity %}
<header class="chrome">
  <a href="/console/packages" style="text-decoration:none">
    <div class="wordmark" role="img" aria-label="fathm">
      <span class="fmark"><svg viewBox="0 0 150 232">
        <line x1="20" y1="10" x2="20" y2="182" stroke="#E8B36A" stroke-width="15" stroke-linecap="round"/>
        <line x1="20" y1="25" x2="116" y2="25" stroke="#E8E0D5" stroke-width="15" stroke-linecap="round"/>
        <line x1="20" y1="86" x2="88" y2="86" stroke="#E8E0D5" stroke-width="15" stroke-linecap="round"/>
        <circle cx="20" cy="182" r="19" fill="#E8B36A"/>
      </svg></span>
      <span class="rest">athm</span>
    </div>
  </a>
  <nav class="crumbs">
    <a href="/console/packages" class="{% block nav_packages %}{% endblock %}">Packages</a>
    <a href="/console/review-queue" class="{% block nav_review_queue %}{% endblock %}">Review Queue</a>
    <a href="/console/standard" class="{% block nav_standard %}{% endblock %}">Standard</a>
    <a href="/console/chat" class="{% block nav_chat %}{% endblock %}">Ask</a>
    {% if "admin" in identity.roles|map(attribute="value")|list %}
    <a href="/console/admin" class="{% block nav_admin %}{% endblock %}">Admin</a>
    {% endif %}
  </nav>
  <div class="whoami">
    <span>{{ identity.id }} · {{ identity.roles|map(attribute="value")|join(", ") }}</span>
    <button class="link-btn"
      hx-post="/logout"
      hx-headers='{"X-Csrf": "{{ csrf_token }}"}'
      hx-on::after-request="if(event.detail.successful) window.location='/console/login'">
      Log out
    </button>
  </div>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<script>
// Query-panel SSE handling (P3.7, see templates/_chat_turn.html). htmx's sse-swap default (a raw
// innerHTML dump of event.data) is fine for the "message" and "error" events - ap_api/chat_routes.py
// HTML-escapes both before they go on the wire - but "citations" travels as JSON (building the
// /console/packages/... link shape is presentation logic that belongs here, not in the
// format-neutral ap_api layer, see CLAUDE.md's console module-boundary note), so it needs its own
// render step: intercept it via htmx's pre-swap hook, cancel the default dump, render links instead.
document.body.addEventListener('htmx:sseBeforeMessage', function (evt) {
  var native = evt.detail; // the raw SSE MessageEvent; .type is the named event, .data its payload
  if (!native) return;
  if (native.type === 'message') {
    var pending = evt.target.querySelector('.chat-pending');
    if (pending) pending.remove();
    return; // let htmx's default beforeend swap append the (already-escaped) token
  }
  if (native.type === 'done') {
    // The vendored sse.js has no working sse-close - close the EventSource here instead, or the
    // browser's native reconnect-on-stream-end behavior re-issues this same question forever.
    // native.target is the EventSource that dispatched this MessageEvent, per the DOM spec.
    // Coverage note: this relies on real browser EventSource semantics (reconnect-on-stream-end,
    // MessageEvent.target) that TestClient/pytest cannot exercise, and no Chrome/Chromium binary
    // was available in the sandbox this fix was authored/reviewed in for browser automation
    // (chrome-devtools-axi). Verified instead via manual live-server SSE/curl testing (confirms
    // the server emits exactly one 'done' frame and the fragment wires the real sse-connect URL);
    // a live-browser check (Network/EventSource state after 'done', no repeat requests) is left
    // for an environment with a browser installed. Deliberately accepted gap, not an oversight -
    // do not add new test infrastructure for this.
    evt.preventDefault();
    if (native.target && typeof native.target.close === 'function') native.target.close();
    return;
  }
  if (native.type !== 'citations') return;
  evt.preventDefault();
  var container = evt.target.querySelector('.chat-citations');
  if (!container) return;
  var items;
  try { items = JSON.parse(native.data); } catch (e) { return; }
  items.forEach(function (c) {
    var a = document.createElement('a');
    a.className = 'citation-link mono';
    a.target = '_blank';
    a.rel = 'noopener';
    a.href = '/console/packages/' + encodeURIComponent(c.package_id)
      + '?version=' + encodeURIComponent(c.package_version)
      + '#' + encodeURIComponent(c.field_path);
    a.textContent = c.package_id + ' · ' + c.field_path;
    container.appendChild(a);
  });
});
// A dropped/failed connection (network error, server crash mid-stream) fires htmx's own sseError
// rather than our named "error" event - sse.js retries with backoff on its own, but surface a
// visible note immediately so the panel never just sits at "thinking…" with no explanation.
document.body.addEventListener('htmx:sseError', function (evt) {
  var turn = evt.target && evt.target.closest ? evt.target.closest('.chat-turn') : null;
  var errBox = turn ? turn.querySelector('.chat-error') : null;
  if (errBox && !errBox.textContent) errBox.textContent = 'Connection interrupted - retrying…';
});
</script>
</body>
</html>
