[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-gate"
version = "0.2.0"
description = "L1 structural validator for the Analysis Package standard (fathm)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ap-gate = "ap_gate.cli:main"
ap-api = "ap_api.__main__:main"
ap-auth = "ap_auth.cli:main"
fathm-ap-mcp = "ap_mcp.server:main"
fathm-chat-telegram = "ap_chat.telegram.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ap_agent_tools = ["templates/**/*"]
ap_console = ["templates/**/*", "static/**/*"]
