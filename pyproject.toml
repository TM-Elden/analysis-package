[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-gate"
version = "0.2.0"
description = "L1 structural validator for the Analysis Package standard (fathm)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ap-gate = "ap_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
