name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ap-gate (with dev deps)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Gate regression - the reference example must pass ap-gate
        run: ap-gate check examples/commodity-commit-v1
